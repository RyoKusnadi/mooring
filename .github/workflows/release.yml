name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      # Builds the web app, then scripts/release.sh writes four tarballs and SHA256SUMS.
      - name: Build release files
        run: make release VERSION="$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "bin/release/$GITHUB_REF_NAME"/*.tar.gz \
            "bin/release/$GITHUB_REF_NAME/SHA256SUMS" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
